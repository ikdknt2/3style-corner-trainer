<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3style エッジペアトレーナー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>3style Edge Trainer</h1>
    
    <div class="counter-display" id="counterDisplay">残り: 0 / 0</div>

    <div class="pair-display" id="pairDisplay">--</div>
    <button id="nextBtn">次へ (Space)</button>
    
    <div class="prev-display" id="prevDisplay"></div>

    <hr class="separator">

    <div class="settings-grid">
        <div class="filter-section">
            <label for="bufferInput">Buffer (1文字)</label>
            <input type="text" id="bufferInput" maxlength="1" placeholder="例：あ" value="あ">
        </div>
        <div class="filter-section">
            <label for="firstCharInput">ペア指定（カンマ区切り可）</label>
            <input type="text" id="firstCharInput" placeholder="例: -あ, -う">
        </div>
    </div>
    
    <div class="scheme-section">
        <label for="schemeInput">レタースキーム設定 (左から順に24文字)</label>
        <input type="text" id="schemeInput" value="あいうえかきくけさしすせたちつてなにぬねはひふへ">
        <div class="scheme-guide" id="schemeGuide"></div>
    </div>
</div>

<script>
    const baseStickers = [
        'UB', 'UR', 'UF', 'UL', 
        'FU', 'FR', 'FD', 'FL', 
        'RU', 'RB', 'RD', 'RF',
        'BU', 'BL', 'BD', 'BR', 
        'LU', 'LF', 'LD', 'LB', 
        'DF', 'DR', 'DB', 'DL'
    ];

    const invalidIndexPairs = [
        [0, 12], [1, 8], [2, 4], [3, 16], [5, 11], [7, 17], 
        [6, 20], [9, 19], [10, 21], [13, 19], [14, 22], [15, 18]
    ];

    const schemeInput = document.getElementById('schemeInput');
    const pairDisplay = document.getElementById('pairDisplay');
    const nextBtn = document.getElementById('nextBtn');
    const bufferInput = document.getElementById('bufferInput');
    const firstCharInput = document.getElementById('firstCharInput');
    const counterDisplay = document.getElementById('counterDisplay');
    const prevDisplay = document.getElementById('prevDisplay');
    const schemeGuide = document.getElementById('schemeGuide');

    let currentDeck = [];
    let totalPairsInDeck = 0;
    let activePair = "";

    function updateGuide(lettersList) {
        schemeGuide.innerHTML = '';
        baseStickers.forEach((sticker, idx) => {
            const char = lettersList[idx] || '?';
            const item = document.createElement('div');
            item.className = 'guide-item';
            item.innerHTML = `<span class="sticker-name">${sticker}</span>:<span class="sticker-char">${char}</span>`;
            schemeGuide.appendChild(item);
        });
    }

    function getLettersList() {
        const val = schemeInput.value.trim();
        return val.split('');
    }

    function getExcludedLetters(lettersList) {
        const bufferChar = bufferInput.value.trim();
        if (!bufferChar || !lettersList.includes(bufferChar)) return [];

        const bufferIdx = lettersList.indexOf(bufferChar);
        let partnerChar = '';

        for (let pair of invalidIndexPairs) {
            if (pair.includes(bufferIdx)) {
                const partnerIdx = pair[0] === bufferIdx ? pair[1] : pair[0];
                partnerChar = lettersList[partnerIdx] || '';
                break;
            }
        }
        return [bufferChar, partnerChar].filter(Boolean);
    }

    function isInvalidIndexPair(idx1, idx2) {
        if (idx1 === idx2) return true;
        for (let pair of invalidIndexPairs) {
            if ((pair[0] === idx1 && pair[1] === idx2) || (pair[0] === idx2 && pair[1] === idx1)) {
                return true;
            }
        }
        return false;
    }

    function matchConditions(firstChar, secondChar, conditions, availableLetters) {
        if (conditions.length === 0 || (conditions.length === 1 && conditions[0] === "")) return true;

        for (let cond of conditions) {
            if (cond.startsWith('-')) {
                const charsPart = cond.substring(1);
                const targetChars = charsPart.split('').filter(char => availableLetters.includes(char));
                if (targetChars.includes(secondChar)) return true;
            } else if (cond.endsWith('-')) {
                const charsPart = cond.substring(0, cond.length - 1);
                const targetChars = charsPart.split('').filter(char => availableLetters.includes(char));
                if (targetChars.includes(firstChar)) return true;
            } else if (cond.length > 0) {
                const targetChars = cond.split('').filter(char => availableLetters.includes(char));
                if (targetChars.includes(firstChar)) return true;
            }
        }
        return false;
    }

    function generateDeck() {
        pairDisplay.classList.remove('error');
        nextBtn.disabled = false;
        prevDisplay.textContent = "";
        activePair = "";

        const lettersList = getLettersList();
        updateGuide(lettersList);

        if (lettersList.length !== 24) {
            pairDisplay.textContent = `エラー: レタースキームは必ず24文字にしてください (現在: ${lettersList.length}文字)`;
            pairDisplay.classList.add('error');
            currentDeck = []; totalPairsInDeck = 0; updateCounter(); nextBtn.disabled = true;
            return;
        }

        const excluded = getExcludedLetters(lettersList);
        const availableLetters = lettersList.filter(char => !excluded.includes(char));

        const rawInput = firstCharInput.value.trim();
        const conditions = rawInput.split(/[,，、]/).map(s => s.trim());

        const allInputChars = rawInput.replace(/[-‐,，、\s]/g, '').split('');
        const hasConflict = allInputChars.some(char => excluded.includes(char));

        if (hasConflict) {
            const bChar = excluded[0] || '';
            const pChar = excluded[1] || '';
            pairDisplay.textContent = `エラー: 指定文字がBuffer「${bChar}」または相方「${pChar}」と重複しています`;
            pairDisplay.classList.add('error');
            currentDeck = []; totalPairsInDeck = 0; updateCounter(); nextBtn.disabled = true;
            return;
        }

        const newDeck = [];

        for (let i = 0; i < 24; i++) {
            for (let j = 0; j < 24; j++) {
                if (isInvalidIndexPair(i, j)) continue;

                const firstChar = lettersList[i];
                const secondChar = lettersList[j];

                if (excluded.includes(firstChar) || excluded.includes(secondChar)) continue;

                if (matchConditions(firstChar, secondChar, conditions, availableLetters)) {
                    newDeck.push(firstChar + secondChar);
                }
            }
        }

        for (let i = newDeck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
        }

        currentDeck = newDeck;
        totalPairsInDeck = newDeck.length;
        updateCounter();
    }

    function updateCounter() {
        counterDisplay.textContent = `残り: ${currentDeck.length} / ${totalPairsInDeck}`;
    }

    function showNextPair() {
        if (pairDisplay.classList.contains('error')) return;

        if (currentDeck.length === 0) {
            generateDeck();
            if (currentDeck.length === 0) {
                pairDisplay.textContent = "なし";
                counterDisplay.textContent = "残り: 0 / 0";
                prevDisplay.textContent = "";
                return;
            }
        }

        if (activePair) {
            prevDisplay.textContent = `前回のペア: ${activePair}`;
        }

        activePair = currentDeck.shift();
        pairDisplay.textContent = activePair;
        updateCounter();
    }

    schemeInput.addEventListener('input', generateDeck);
    bufferInput.addEventListener('input', () => { generateDeck(); if (!pairDisplay.classList.contains('error')) showNextPair(); });
    firstCharInput.addEventListener('input', () => { generateDeck(); if (!pairDisplay.classList.contains('error')) showNextPair(); });

    nextBtn.addEventListener('click', showNextPair);

    document.addEventListener('keydown', (event) => {
        if (document.activeElement === firstCharInput || document.activeElement === bufferInput || document.activeElement === schemeInput) return;
        if (event.code === 'Space') {
            event.preventDefault();
            showNextPair();
        }
    });

    generateDeck();
    if (!pairDisplay.classList.contains('error')) showNextPair();
</script>

</body>
</html>
